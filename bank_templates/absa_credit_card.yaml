# ABSA Credit Card Statement Template
#
# This is an EXAMPLE template for ABSA credit card statements.
# You will need to customize the patterns based on your actual ABSA statement format.
#
# HOW TO CUSTOMIZE:
# 1. Open your ABSA credit card statement PDF
# 2. Look at a transaction line and identify the pattern
# 3. Update the 'transaction_pattern' regex to match your format
# 4. Test with: python main.py --parse-bank-statement statement.pdf --bank-template absa_credit_card
#
# Example transaction formats to look for:
# "05 SEP WOOLWORTHS RONDEBOSCH 450.00"
# "12/09 POS PURCHASE UBER *TRIP 234.50"
# "15 SEP 2024 TAKEALOT.COM 1,299.99"

bank_name: "ABSA"
account_type: "Credit Card"
country: "ZA"

# Auto-detection configuration
# CUSTOMIZE: Update based on your ABSA credit card statement
detection:
  markers:
    - "ABSA"
    - "CREDIT CARD"
    - "ABSA CREDIT CARD"
    - "CARD NUMBER"
  priority: 6

# Transaction parsing configuration
# CUSTOMIZE: Match your statement's transaction format
parsing:
  # EXAMPLE pattern - customize this!
  # This example assumes format: DD MON Description Amount
  transaction_pattern: '(?P<day>\d{2})\s+(?P<month>JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)\s+(?P<description>.+?)\s+(?P<amount>\d{1,3}(?:,\d{3})*\.\d{2})(?P<credit>CR)?'

  # Date parsing
  date:
    day_group: "day"
    month_group: "month"
    format: "%d %b"         # Adjust to your format
    year_source: "statement"
    adjust_year: true

    # If months are uppercase, add translation
    month_translation:
      JAN: "Jan"
      FEB: "Feb"
      MAR: "Mar"
      APR: "Apr"
      MAY: "May"
      JUN: "Jun"
      JUL: "Jul"
      AUG: "Aug"
      SEP: "Sep"
      OCT: "Oct"
      NOV: "Nov"
      DEC: "Dec"

  # Amount parsing
  amount:
    group: "amount"
    decimal_separator: "."
    thousands_separator: ","

    # Credit indicator (payments)
    credit_indicator:
      group: "credit"
      value: "CR"  # Adjust if your statement uses different indicator

  # Description extraction
  description:
    group: "description"

    cleanup:
      # Remove trailing country codes
      - pattern: '\s+ZA\s*$'
        replace: ''

      # Remove card reference numbers
      - pattern: '\s+\d{4}\s*\*+\s*\d{4}\s*'
        replace: ''

      # Collapse spaces
      - pattern: '\s{2,}'
        replace: ' '

    min_length: 3

  # Optional: Card number tracking
  card_number:
    context_pattern: '(?:Card|Card No|Card Number)\s*:?\s*(?P<card>[\d\s*]+)'
    extract_last_digits: 4
    scope: "until_next_card"

# Section boundaries
# CUSTOMIZE: Based on your statement layout
sections:
  start_markers:
    - "Transaction Date"
    - "DATE"
    - "TRANSACTIONS"
    - "Description"
    - "DESCRIPTION"

  end_markers:
    - "TOTAL"
    - "Total Owing"
    - "Closing Balance"
    - "Payment Due"
    - "Minimum Payment"

  skip_lines:
    - "Opening Balance"
    - "Previous Balance"
    - "Closing Balance"
    - "Payment Due"
    - "Minimum Payment"
    - "Page "
    - "Statement"
    - "ABSA"
    - "Interest"
    - "Annual Fee"

# Statement summary extraction
# CUSTOMIZE: Based on your ABSA credit card statement
summary:
  statement_date:
    patterns:
      - 'Statement Date\s*:?\s*(?P<date>\d{2}\s+\w+\s+\d{4})'
      - 'Date\s*:?\s*(?P<date>\d{2}/\d{2}/\d{4})'
    format: "%d %b %Y"  # Adjust to match format

  opening_balance:
    patterns:
      - 'Opening Balance\s*:?\s*(?P<amount>[\d\s,.]+)'
      - 'Previous Balance\s*:?\s*(?P<amount>[\d\s,.]+)'

  closing_balance:
    patterns:
      - 'Closing Balance\s*:?\s*(?P<amount>[\d\s,.]+)'
      - 'New Balance\s*:?\s*(?P<amount>[\d\s,.]+)'
      - 'Total Owing\s*:?\s*(?P<amount>[\d\s,.]+)'

  total_expenses:
    patterns:
      - 'Total Purchases\s*:?\s*(?P<amount>[\d\s,.]+)'
      - 'Purchases\s*:?\s*(?P<amount>[\d\s,.]+)'

  total_payments:
    patterns:
      - 'Total Payments\s*:?\s*(?P<amount>[\d\s,.]+)CR'
      - 'Payments Received\s*:?\s*(?P<amount>[\d\s,.]+)'

  interest_fees:
    patterns:
      - 'Interest Charged\s*:?\s*(?P<amount>[\d\s,.]+)'
      - 'Fees\s*:?\s*(?P<amount>[\d\s,.]+)'

  statement_number:
    patterns:
      - 'Statement (?:No|Number)\s*:?\s*(?P<number>\d+)'

  account_number:
    patterns:
      - 'Card Number\s*:?\s*(?P<account>[\d\s*]+)'
      - 'Account Number\s*:?\s*(?P<account>[\d\s]+)'

# Output configuration
output:
  account_type: "absa_credit_card"

# CUSTOMIZATION GUIDE:
# =====================
#
# CREDIT CARD SPECIFIC TIPS:
#
# 1. TRANSACTION PATTERNS:
#    - Credit cards often use: DD MON Description Amount
#    - Some use: DD/MM Description Amount
#    - Check if your statement includes transaction time or location
#
# 2. PAYMENTS vs PURCHASES:
#    - Purchases are debits (money you owe)
#    - Payments are credits (money you paid) - often marked with "CR"
#    - Make sure credit_indicator matches your statement
#
# 3. COMMON VARIATIONS:
#    - Month names might be uppercase (JAN) or titlecase (Jan)
#    - Amounts might have "R" prefix (R450.00) or not (450.00)
#    - Credits might be marked with "-" or "CR" suffix
#
# 4. SECTION DETECTION:
#    - Credit card statements often have:
#      - Previous Balance section
#      - New Transactions section
#      - Payments section
#      - Fees section
#    - Adjust start_markers to capture the transactions section
#
# 5. TESTING:
#    - Start with one statement
#    - Test: python main.py --parse-bank-statement statement.pdf --bank-template absa_credit_card
#    - If no transactions found, check section markers first
#    - If transactions malformed, check transaction_pattern
#
# 6. GETTING HELP:
#    - See docs/BANK_TEMPLATES.md for detailed pattern examples
#    - Use an online regex tester (regex101.com) to test patterns
#    - Check FNB templates for working examples
#
# EXAMPLE CUSTOMIZATION:
# If your transaction line looks like:
# "15/09 WOOLWORTHS  R 450.00"
#
# Update transaction_pattern to:
# '(?P<day>\d{2})/(?P<month>\d{2})\s+(?P<description>.+?)\s+R?\s*(?P<amount>\d{1,3}(?:,\d{3})*\.\d{2})'
#
# Update date format to:
# format: "%d/%m"
# (No year in pattern, so keep year_source: "statement")
